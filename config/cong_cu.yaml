# BỘ CÔNG CỤ TÍNH VÀ CÔNG THỨC CHUNG CỦA TỪNG CẤU KIỆN
# Mỗi công cụ có một bộ công thức mặc định. Trên giao diện, Sếp sửa được công thức rồi bấm "Lưu làm mặc định":
# bản sửa được ghi vào data/cong_cu_tuy_chinh.yaml (không đụng file này), bấm "Khôi phục" để quay về bản gốc.
#
# Biến dùng trong biểu thức (mỗi ký hiệu cấu kiện là một dòng, số liệu của MỘT cái, n là số lượng):
#   n  số lượng            a  dài (cạnh lớn, m)      b  rộng (cạnh nhỏ, m)     h  cao / dày (m)
#   S  diện tích (m²)      P  chu vi (m)             L  chiều dài (m, đường hoặc cạnh dài)
#   cộng với các "tham_so" khai báo riêng của từng công cụ (ví dụ c, H, d).
# Toán tử: + - * / ** và ngoặc; hàm: min, max, abs, sqrt, round.
#
# nguon: loại đối tượng lấy khi quét chọn mặt bằng
#   mong | coc | cot | da_kieng | dam | san | khac (lấy mọi đối tượng đã chọn)

dao_dat:
  ten: "Tính KL đào đất"
  nguon: mong
  mo_ta: "Đào hố móng theo từng ký hiệu móng: (dài + 2c) × (rộng + 2c) × sâu H."
  buoc1: "Quét chọn mặt bằng móng"
  buoc2: "Quét chọn chi tiết móng (lấy cao độ, kích thước)"
  tham_so:
    c: {ten: "Mở rộng đáy hố mỗi phía (m)", gia_tri: 0.3}
    H: {ten: "Chiều sâu đào (m)", gia_tri: 1.5}
    d: {ten: "Lót rộng hơn móng mỗi phía (m)", gia_tri: 0.1}
    tl: {ten: "Dày bê tông lót (m)", gia_tri: 0.1}
  cong_thuc:
    - {ten: "Đào đất hố móng", dv: "m3", bt: "n*(a+2*c)*(b+2*c)*H"}
    - {ten: "Đầm, hoàn thiện đáy hố", dv: "m2", bt: "n*(a+2*c)*(b+2*c)"}
    - {ten: "Đắp đất hoàn trả hố móng (đào trừ móng và lót; chưa trừ cổ cột)", dv: "m3", bt: "n*(a+2*c)*(b+2*c)*H - n*S*h - n*(a+2*d)*(b+2*d)*tl"}
    - {ten: "Đất thừa vận chuyển đi (= thể tích móng + lót)", dv: "m3", bt: "n*S*h + n*(a+2*d)*(b+2*d)*tl"}

mong:
  ten: "Tính KL móng"
  nguon: mong
  mo_ta: "Bóc bê tông lót, bê tông và ván khuôn móng theo từng ký hiệu móng."
  buoc1: "Quét chọn mặt bằng móng"
  buoc2: "Quét chọn chi tiết móng (lấy chiều cao móng)"
  tham_so:
    d: {ten: "Lót rộng hơn móng mỗi phía (m)", gia_tri: 0.1}
    tl: {ten: "Dày bê tông lót (m)", gia_tri: 0.1}
    hl: {ten: "Hàm lượng thép móng (kg/m³ bê tông)", gia_tri: 80}
  cong_thuc:
    - {ten: "Bê tông lót móng", dv: "m3", bt: "n*(a+2*d)*(b+2*d)*tl"}
    - {ten: "Bê tông móng", dv: "m3", bt: "n*S*h"}
    - {ten: "Ván khuôn móng", dv: "m2", bt: "n*P*h"}
    - {ten: "Cốt thép móng (ước tính theo hàm lượng)", dv: "kg", bt: "n*S*h*hl"}

da_kieng:
  ten: "Tính KL đà kiềng"
  nguon: da_kieng
  mo_ta: "Đà kiềng (giằng móng) nằm trên đất nên ván khuôn chỉ tính hai thành bên."
  buoc1: "Quét chọn mặt bằng đà kiềng"
  buoc2: "Quét chọn chi tiết đà kiềng (lấy b × h)"
  tham_so:
    d: {ten: "Lót rộng hơn đà kiềng mỗi phía (m)", gia_tri: 0.1}
    tl: {ten: "Dày bê tông lót (m)", gia_tri: 0.1}
    c: {ten: "Mở rộng đáy rãnh đào mỗi phía (m)", gia_tri: 0.2}
    H: {ten: "Chiều sâu đào rãnh đà kiềng (m)", gia_tri: 0.6}
    hl: {ten: "Hàm lượng thép đà kiềng (kg/m³ bê tông)", gia_tri: 120}
  cong_thuc:
    - {ten: "Bê tông đà kiềng", dv: "m3", bt: "n*L*b*h"}
    - {ten: "Ván khuôn đà kiềng", dv: "m2", bt: "n*L*2*h"}
    - {ten: "Bê tông lót đà kiềng", dv: "m3", bt: "n*L*(b+2*d)*tl"}
    - {ten: "Đào đất rãnh đà kiềng", dv: "m3", bt: "n*L*(b+2*c)*H"}
    - {ten: "Cốt thép đà kiềng (ước tính theo hàm lượng)", dv: "kg", bt: "n*L*b*h*hl"}

cot:
  ten: "Tính KL cột"
  nguon: cot
  mo_ta: "Cột theo ký hiệu: bê tông = diện tích × cao, ván khuôn = chu vi × cao."
  buoc1: "Quét chọn mặt bằng cột"
  buoc2: "Quét chọn chi tiết cột (lấy chiều cao)"
  tham_so:
    hl: {ten: "Hàm lượng thép cột (kg/m³ bê tông)", gia_tri: 150}
  cong_thuc:
    - {ten: "Bê tông cột", dv: "m3", bt: "n*S*h"}
    - {ten: "Ván khuôn cột", dv: "m2", bt: "n*P*h"}
    - {ten: "Cốt thép cột (ước tính theo hàm lượng)", dv: "kg", bt: "n*S*h*hl"}

dam:
  ten: "Tính KL dầm"
  nguon: dam
  mo_ta: "Dầm theo ký hiệu: dài × rộng × cao; ván khuôn tính đáy và hai thành."
  buoc1: "Quét chọn mặt bằng dầm"
  buoc2: "Quét chọn chi tiết dầm (lấy b × h)"
  tham_so:
    hl: {ten: "Hàm lượng thép dầm (kg/m³ bê tông)", gia_tri: 150}
  cong_thuc:
    - {ten: "Bê tông dầm", dv: "m3", bt: "n*L*b*h"}
    - {ten: "Ván khuôn dầm", dv: "m2", bt: "n*L*(b+2*h)"}
    - {ten: "Cốt thép dầm (ước tính theo hàm lượng)", dv: "kg", bt: "n*L*b*h*hl"}

san:
  ten: "Tính KL sàn"
  nguon: san
  mo_ta: "Sàn theo ký hiệu: diện tích × dày."
  buoc1: "Quét chọn mặt bằng sàn"
  buoc2: "Quét chọn ghi chú / chi tiết sàn (lấy chiều dày)"
  tham_so:
    hl: {ten: "Hàm lượng thép sàn (kg/m³ bê tông)", gia_tri: 90}
  cong_thuc:
    - {ten: "Bê tông sàn", dv: "m3", bt: "n*S*h"}
    - {ten: "Ván khuôn sàn", dv: "m2", bt: "n*S"}
    - {ten: "Cốt thép sàn (ước tính theo hàm lượng)", dv: "kg", bt: "n*S*h*hl"}

khac:
  ten: "Cấu kiện khác"
  nguon: khac
  mo_ta: "Cấu kiện bất kỳ: lấy mọi đối tượng đã quét chọn, tự chọn công thức."
  buoc1: "Quét chọn đối tượng trên mặt bằng"
  buoc2: "Quét chọn chi tiết (nếu có)"
  tham_so:
    hl: {ten: "Hàm lượng thép (kg/m³ bê tông)", gia_tri: 100}
  cong_thuc:
    - {ten: "Số lượng", dv: "cái", bt: "n"}
    - {ten: "Diện tích", dv: "m2", bt: "n*S"}
    - {ten: "Thể tích = S × dày", dv: "m3", bt: "n*S*h"}
    - {ten: "Chiều dài", dv: "m", bt: "n*L"}
    - {ten: "Ván khuôn thành = chu vi × cao", dv: "m2", bt: "n*P*h"}
    - {ten: "Thể tích dạng thanh = L × b × h", dv: "m3", bt: "n*L*b*h"}
    - {ten: "Cốt thép (ước tính theo hàm lượng, trên thể tích S × h)", dv: "kg", bt: "n*S*h*hl"}

# ---------- Các công cụ bổ sung (theo mặt bằng cọc, nền, mái, lanh tô trong bản vẽ) ----------
coc:
  ten: "Tính KL cọc"
  nguon: coc
  mo_ta: "Cọc theo ký hiệu (P1, P2...): đọc đường kính và chiều dài từ nhãn 'P1 D300 L=16m'. Đếm số cọc, tổng chiều dài, bê tông và đập đầu cọc. Quét chọn riêng mặt bằng cọc (không gộp với móng)."
  buoc1: "Quét chọn mặt bằng cọc"
  buoc2: "Quét chọn chi tiết / bảng cọc (lấy kích thước, cao độ)"
  tham_so:
    hd: {ten: "Chiều dài đầu cọc đập bỏ (m)", gia_tri: 0.5}
    hl: {ten: "Hàm lượng thép cọc (kg/m³ bê tông)", gia_tri: 60}
  # h = chiều dài cọc (lấy từ nhãn L=16m, hoặc nhập tay ở cột h); S = π·D²/4 theo đường kính trên nhãn
  cong_thuc:
    - {ten: "Số lượng cọc", dv: "cái", bt: "n"}
    - {ten: "Tổng chiều dài cọc", dv: "m", bt: "n*h"}
    - {ten: "Bê tông cọc", dv: "m3", bt: "n*S*h"}
    - {ten: "Đập đầu cọc", dv: "m3", bt: "n*S*hd"}
    - {ten: "Cốt thép cọc (ước tính theo hàm lượng)", dv: "kg", bt: "n*S*h*hl"}

lanh_to:
  ten: "Tính KL lanh tô"
  nguon: dam
  mo_ta: "Lanh tô trên cửa: dài tính thêm đoạn gối vào tường hai đầu; ván khuôn tính đáy và hai thành."
  buoc1: "Quét chọn mặt bằng lanh tô"
  buoc2: "Quét chọn chi tiết lanh tô (lấy b × h)"
  tham_so:
    gd: {ten: "Đoạn gối vào tường mỗi đầu (m)", gia_tri: 0.2}
    hl: {ten: "Hàm lượng thép lanh tô (kg/m³ bê tông)", gia_tri: 100}
  cong_thuc:
    - {ten: "Bê tông lanh tô", dv: "m3", bt: "n*(L+2*gd)*b*h"}
    - {ten: "Ván khuôn lanh tô", dv: "m2", bt: "n*(L+2*gd)*(b+2*h)"}
    - {ten: "Cốt thép lanh tô (ước tính theo hàm lượng)", dv: "kg", bt: "n*(L+2*gd)*b*h*hl"}

tuong:
  ten: "Tính KL tường xây, trát"
  nguon: khac
  mo_ta: "Tường theo chiều dài tim: xây, trát hai mặt. Dài L lấy từ đường tim tường hoặc cạnh dài hình; nhập cao tường, dày tường, diện tích lỗ cửa trừ đi (m² mỗi đoạn)."
  buoc1: "Quét chọn mặt bằng tường"
  buoc2: "Quét chọn chi tiết / ghi chú tường (nếu có)"
  tham_so:
    Ht: {ten: "Cao tường (m)", gia_tri: 3.0}
    td: {ten: "Dày tường (m)", gia_tri: 0.2}
    Sc: {ten: "Diện tích lỗ cửa trừ đi mỗi đoạn (m²)", gia_tri: 0}
  cong_thuc:
    - {ten: "Diện tích tường (đã trừ lỗ cửa)", dv: "m2", bt: "n*(L*Ht-Sc)"}
    - {ten: "Xây tường", dv: "m3", bt: "n*(L*Ht-Sc)*td"}
    - {ten: "Trát tường hai mặt", dv: "m2", bt: "n*(L*Ht-Sc)*2"}

nen:
  ten: "Tính KL sàn nền"
  nguon: san
  mo_ta: "Sàn nền trệt: đắp cát san nền, bê tông lót, bê tông nền, ván khuôn thành và lưới thép nền (kg/m²)."
  buoc1: "Quét chọn mặt bằng nền"
  buoc2: "Quét chọn ghi chú / chi tiết nền (lấy chiều dày)"
  tham_so:
    hd: {ten: "Dày lớp cát/đất đắp san nền (m)", gia_tri: 0.3}
    tl: {ten: "Dày bê tông lót nền (m)", gia_tri: 0.1}
    tm: {ten: "Thép nền (kg/m²; Ø8a200 hai lớp ≈ 3,95)", gia_tri: 3.95}
  cong_thuc:
    - {ten: "Đắp cát/đất san nền", dv: "m3", bt: "n*S*hd"}
    - {ten: "Bê tông lót nền", dv: "m3", bt: "n*S*tl"}
    - {ten: "Bê tông nền", dv: "m3", bt: "n*S*h"}
    - {ten: "Ván khuôn thành nền", dv: "m2", bt: "n*P*h"}
    - {ten: "Lưới thép nền", dv: "kg", bt: "n*S*tm"}

mai:
  ten: "Tính KL sàn mái"
  nguon: san
  mo_ta: "Sàn mái: bê tông, ván khuôn, thép, vữa tạo dốc và chống thấm (có tính phần cuộn lên tường chắn mái)."
  buoc1: "Quét chọn mặt bằng mái"
  buoc2: "Quét chọn ghi chú / chi tiết mái (lấy chiều dày)"
  tham_so:
    hl: {ten: "Hàm lượng thép sàn mái (kg/m³ bê tông)", gia_tri: 90}
    td: {ten: "Dày trung bình vữa tạo dốc (m)", gia_tri: 0.04}
    hc: {ten: "Chống thấm cuộn lên tường chắn mái (m)", gia_tri: 0.3}
  cong_thuc:
    - {ten: "Bê tông sàn mái", dv: "m3", bt: "n*S*h"}
    - {ten: "Ván khuôn sàn mái", dv: "m2", bt: "n*S"}
    - {ten: "Cốt thép sàn mái (ước tính theo hàm lượng)", dv: "kg", bt: "n*S*h*hl"}
    - {ten: "Vữa tạo dốc", dv: "m3", bt: "n*S*td"}
    - {ten: "Chống thấm mái", dv: "m2", bt: "n*(S+P*hc)"}
